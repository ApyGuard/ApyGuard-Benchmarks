name: APY-032-26 SQL Injection Column Selection - Ledger API
level: 3
tags:
  - sqli
  - api
  - injection

content:
  - kind: description
    content_type: text/markdown
    content: >
      Authenticated ledger export allows user-controlled SQL column projection
      enabling UNION-based extraction of hidden table data.

x_apyguard:
  category: sql_injection
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: SQL Injection Column Selection
    primary_endpoint: /api/ledger/export
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: analyst

  ports:
    internal: 80
    preferred_host: 56454
