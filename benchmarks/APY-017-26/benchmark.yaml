name: APY-017-26 Method-Level Authorization Mismatch - Profile API
level: 2
tags:
  - api
  - authorization
  - method_mismatch

content:
  - kind: description
    content_type: text/markdown
    content: >
      Resource read operation enforces ownership but write operation does not
      enabling unauthorized profile mutation.

x_apyguard:
  category: method_level_authorization_mismatch
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Method-Level Authorization Mismatch
    primary_endpoint: /api/profiles/{user_id}
    primary_method: PATCH

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member
    - email: bob@example.com
      password: bob123
      role: member

  ports:
    internal: 80
    preferred_host: 18021
