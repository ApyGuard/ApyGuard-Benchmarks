name: APY-013-26 File Upload Abuse - Path Traversal Download
level: 2
tags:
  - api
  - file_upload
  - traversal

content:
  - kind: description
    content_type: text/markdown
    content: >
      File download path handling allows traversal outside upload directory
      exposing sensitive server files.

x_apyguard:
  category: file_upload_abuse
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: File Upload Abuse / Path Traversal
    primary_endpoint: /api/files/download
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member

  ports:
    internal: 80
    preferred_host: 18016
