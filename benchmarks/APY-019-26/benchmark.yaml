name: APY-019-26 Policy Shadowing Route Conflict - Admin API
level: 2
tags:
  - api
  - authorization
  - routing

content:
  - kind: description
    content_type: text/markdown
    content: >
      Equivalent admin behavior is reachable through a shadow route that applies
      weaker authorization middleware than the canonical route.

x_apyguard:
  category: policy_shadowing_route_conflict
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Policy Shadowing Route Conflict
    primary_endpoint: /api/users/{user_id}/admin/export
    primary_method: POST

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member

  ports:
    internal: 80
    preferred_host: 18024
