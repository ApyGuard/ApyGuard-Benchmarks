name: APY-002-26 BFLA - Support Admin API
level: 2
tags:
  - broken_access_control
  - api
  - jwt

content:
  - kind: description
    content_type: text/markdown
    content: >
      The API uses roles, but not every privileged route may verify them correctly.
      If you can access a sensitive admin function directly, try it.

x_apyguard:
  category: broken_function_level_authorization
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: BFLA
    primary_endpoint: /api/admin/export
    primary_method: POST

  seed_users:
    - email: alice@example.com
      password: alice123
      role: support
    - email: admin@apy.local
      password: UltraSecretAdmin!
      role: admin

  ports:
    internal: 80
    preferred_host: 18002
