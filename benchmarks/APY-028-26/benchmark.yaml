name: APY-028-26 NoSQL Operator Injection - Search API
level: 2
tags:
  - nosql
  - api
  - injection

content:
  - kind: description
    content_type: text/markdown
    content: >
      Use JSON operator objects to bypass owner constraints and read restricted records.

x_apyguard:
  category: injection
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: NoSQL Operator Injection
    primary_endpoint: /api/search
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member

  ports:
    internal: 80
    preferred_host: 56447
