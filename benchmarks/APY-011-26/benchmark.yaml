      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Improper Inventory Management
    primary_endpoint: /api/v1/admin/reports
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: support
    - email: admin@apy.local
      password: AdminLegacy!
      role: admin

  ports:
    internal: 80
    preferred_host: 18013
