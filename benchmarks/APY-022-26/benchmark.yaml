name: APY-022-26 Ownership Transfer Bypass - Projects API
level: 2
tags:
  - api
  - authorization
  - ownership

content:
  - kind: description
    content_type: text/markdown
    content: >
      Project ownership transfer trusts caller input and omits checks that the
      initiator is authorized to reassign the target resource.

x_apyguard:
  category: ownership_transfer_bypass
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Ownership Transfer Bypass
    primary_endpoint: /api/projects/{project_id}/transfer
    primary_method: POST

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member

  ports:
    internal: 80
    preferred_host: 18027
