name: APY-016-26 Bulk Authorization Gap - Orders API
level: 2
tags:
  - api
  - authorization
  - bola
  - bulk

content:
  - kind: description
    content_type: text/markdown
    content: >
      Bulk order export endpoint skips per-object ownership checks
      enabling cross-user data extraction.

x_apyguard:
  category: bulk_authorization_gap
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Bulk Authorization Gap
    primary_endpoint: /api/orders/bulk-export
    primary_method: POST

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member
    - email: bob@example.com
      password: bob123
      role: member

  ports:
    internal: 80
    preferred_host: 18020
