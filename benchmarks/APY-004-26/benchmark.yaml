name: APY-004-26 JWT Forgery - Partner API
level: 3
tags:
  - jwt
  - api
  - broken_authentication

content:
  - kind: description
    content_type: text/markdown
    content: >
      Sends JWT with alg=none (dynamic token). Detects algorithm confusion where
      server accepts unverified JWT.

x_apyguard:
  category: jwt_forgery
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: JWT alg=none acceptance
    primary_endpoint: /api/partner/billing
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: analyst
    - email: partner-admin@apy.local
      password: UltraHiddenPartnerPass!
      role: partner_admin

  ports:
    internal: 80
    preferred_host: 18004
