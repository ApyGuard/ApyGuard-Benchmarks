name: APY-029-26 Numeric Notation Limit Bypass - Analytics API
level: 2
tags:
  - resource_consumption
  - api
  - abuse

content:
  - kind: description
    content_type: text/markdown
    content: >
      Bypass export row limits by sending non-decimal numeric notation and trigger oversized processing.

x_apyguard:
