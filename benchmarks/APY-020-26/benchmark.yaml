name: APY-020-26 Wildcard Role Matching - Audit API
level: 2
tags:
  - api
  - authorization
  - rbac

content:
  - kind: description
    content_type: text/markdown
    content: >
      Role checks use wildcard/substring matching and incorrectly grant access
      to admin-only endpoints.

x_apyguard:
  category: wildcard_role_matching
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Wildcard Role Matching
    primary_endpoint: /api/audit/admin/logs
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: support

  ports:
    internal: 80
    preferred_host: 18025
