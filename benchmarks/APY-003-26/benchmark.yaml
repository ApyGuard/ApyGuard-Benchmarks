name: APY-003-26 Mass Assignment - Workspace API
level: 2
tags:
  - mass_assignment
  - api
  - jwt

content:
  - kind: description
    content_type: text/markdown
    content: >
      The API lets users update their profile after login. Look closely at what
      fields the backend will accept, not just what the client is supposed to send.

x_apyguard:
  category: mass_assignment
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Mass Assignment
    primary_endpoint: /api/me
    primary_method: PATCH

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member
    - email: owner@apy.local
      password: OwnerOnly!123
      role: admin

  ports:
    internal: 80
    preferred_host: 18003
