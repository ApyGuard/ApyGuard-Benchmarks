name: APY-001-26 BOLA - Order Management API
level: 1
tags:
  - idor
  - api
  - jwt

content:
  - kind: description
    content_type: text/markdown
    content: >
      The API uses bearer tokens, but object access may not be scoped correctly.
      If you see identifiers in API paths, try nearby values.

x_apyguard:
  category: broken_object_level_authorization
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: BOLA
    primary_endpoint: /api/orders/{order_id}
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: user
    - email: bob@example.com
      password: bob123
      role: user

  ports:
    internal: 80
    preferred_host: 18001
