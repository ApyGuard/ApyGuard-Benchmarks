name: APY-007-26 Excessive Data Exposure
level: 2
tags:
  - api
  - data_exposure
  - privacy

content:
  - kind: description
    content_type: text/markdown
    content: >
      The account summary endpoint is expected to return only minimal profile details
      but backend serialization may expose far more fields than business logic requires.

x_apyguard:
  category: excessive_data_exposure
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: Excessive Data Exposure
    primary_endpoint: /api/account/summary
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: member

  ports:
    internal: 80
    preferred_host: 18007
