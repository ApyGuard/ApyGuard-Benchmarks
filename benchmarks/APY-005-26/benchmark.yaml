name: APY-005-26 SQL Injection - Reports API
level: 3
tags:
  - sqli
  - api
  - jwt

content:
  - kind: description
    content_type: text/markdown
    content: >
      The reports API is only accessible after login, but its filtering logic
      may be less trustworthy than its authentication layer.

x_apyguard:
  category: sql_injection
  openapi_path: /openapi.json
  docs_path: /docs
  health_path: /ping

  auth:
    type: bearer_jwt
    login_path: /api/auth/login
    method: POST
    request_content_type: application/json
    credentials:
      email: alice@example.com
      password: alice123
    token_response_path: access_token
    token_type_response_path: token_type
    authorization_header: Authorization
    authorization_prefix: Bearer

  expected:
    win_condition: flag
    vulnerability_type: SQL Injection
    primary_endpoint: /api/reports/search
    primary_method: GET

  seed_users:
    - email: alice@example.com
      password: alice123
      role: analyst

  ports:
    internal: 80
    preferred_host: 18005
